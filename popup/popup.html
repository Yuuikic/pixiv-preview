<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P² Settings</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body data-settings-surface="popup">
    <main class="settings-panel">
      <header class="settings-header">
        <div><p class="eyebrow"><span data-i18n="settingsEyebrow"></span> <span id="extension-version"></span></p><h1 data-i18n="settingsTitle"></h1></div>
        <button id="open-options" class="icon-button" type="button" data-i18n-title="openFullSettings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
      </header>

      <section aria-labelledby="delay-label"><div class="setting-heading"><label id="delay-label" for="delay-number" data-i18n="hoverDelay"></label><div class="number-field"><input id="delay-number" type="number" inputmode="numeric"><span>ms</span></div></div><input id="delay-range" type="range" aria-labelledby="delay-label"><div class="range-labels" aria-hidden="true"><span data-i18n="moreResponsive"></span><span data-i18n="fewerAccidents"></span></div><p class="hint" data-i18n="hoverDelayHint"></p></section>
      <section class="timing-setting" aria-labelledby="residue-label"><div class="setting-heading"><label id="residue-label" for="residue-number" data-i18n="residue"></label><div class="number-field"><input id="residue-number" type="number" inputmode="numeric"><span>ms</span></div></div><input id="residue-range" type="range" aria-labelledby="residue-label"><div class="range-labels" aria-hidden="true"><span data-i18n="hideImmediately"></span><span data-i18n="easierEntry"></span></div><p class="hint" data-i18n="residueHint"></p></section>
      <section class="toggle-setting" aria-labelledby="occluded-switch-label"><div><label id="occluded-switch-label" for="occluded-switch" data-i18n="occluded"></label><p data-i18n="occludedHint"></p></div><label class="switch"><input id="occluded-switch" type="checkbox" aria-labelledby="occluded-switch-label"><span aria-hidden="true"></span></label></section>
      <section class="toggle-setting" aria-labelledby="original-label"><div><label id="original-label" for="original-upgrade" data-i18n="original"></label><p data-i18n="originalHint"></p></div><label class="switch"><input id="original-upgrade" type="checkbox" aria-labelledby="original-label"><span aria-hidden="true"></span></label></section>
      <section class="toggle-setting" aria-labelledby="auto-arrange-label"><div><label id="auto-arrange-label" for="auto-arrange" data-i18n="autoArrange"></label><p data-i18n="autoArrangeHint"></p></div><label class="switch"><input id="auto-arrange" type="checkbox" aria-labelledby="auto-arrange-label"><span aria-hidden="true"></span></label></section>

      <section class="shortcut-settings" aria-labelledby="shortcut-heading"><h2 id="shortcut-heading" data-i18n="shortcuts"></h2><div class="shortcut-row"><label for="sticky-shortcut" data-i18n="stickyShortcut"></label><button id="sticky-shortcut" class="shortcut-key" type="button"></button></div><div class="shortcut-row"><label for="nazurin-shortcut" data-i18n="nazurinShortcut"></label><button id="nazurin-shortcut" class="shortcut-key" type="button"></button></div><p class="hint shortcut-hint" data-i18n="shortcutHint"></p></section>

      <details class="nazurin-settings">
        <summary class="nazurin-heading-row"><span><span class="section-kicker" data-i18n="quickCollect"></span><strong>Nazurin</strong></span><span id="nazurin-verification-indicator" class="verification-dot" aria-hidden="true"></span></summary>
        <div class="nazurin-body"><label class="text-field"><span>API Host</span><input id="nazurin-host" type="url" inputmode="url" autocomplete="url" placeholder="https://nazurin.example/" spellcheck="false"></label><label class="text-field"><span>Bot Token</span><input id="nazurin-token" type="password" autocomplete="off" placeholder="Telegram Bot Token" spellcheck="false"></label><p id="nazurin-http-warning" class="security-warning" data-i18n="insecureHttp" hidden></p><p class="hint nazurin-hint" data-i18n="nazurinHint"></p><div class="nazurin-actions"><button id="nazurin-save" class="primary-button" type="button" data-i18n="save"></button><button id="nazurin-test" type="button" data-i18n="testConnection"></button><button id="nazurin-clear" class="danger-button" type="button" data-i18n="clear"></button></div><span id="nazurin-status" class="nazurin-status" role="status" aria-live="polite"></span></div>
      </details>
      <footer><button id="reset-button" type="button" data-i18n="resetDefaults"></button><span id="save-status" role="status" aria-live="polite"></span></footer>
    </main>
    <script src="../src/settings.js"></script><script src="../src/i18n.js"></script><script src="popup.js"></script>
  </body>
</html>
