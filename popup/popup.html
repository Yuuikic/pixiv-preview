<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2 Settings</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body data-settings-surface="popup">
    <main class="settings-panel">
      <header class="settings-header">
        <div><p class="eyebrow"><span data-i18n="settingsEyebrow"></span> <span id="extension-version"></span></p><h1 id="settings-title" tabindex="-1" data-i18n="settingsTitle"></h1></div>
        <button id="open-options" class="icon-button" type="button" data-i18n-title="openFullSettings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
      </header>


      <section id="settings-preview" class="settings-group" data-setup-section="0" aria-labelledby="preview-behavior-heading">
        <h2 id="preview-behavior-heading" data-i18n="previewBehavior"></h2><p class="group-description" data-i18n="previewBehaviorHint"></p>
        <div aria-labelledby="delay-label"><div class="setting-heading"><label id="delay-label" for="delay-number" data-i18n="hoverDelay"></label><div class="number-field"><input id="delay-number" type="number" inputmode="numeric"><span>ms</span></div></div><input id="delay-range" type="range" aria-labelledby="delay-label"><div class="range-labels" aria-hidden="true"><span data-i18n="moreResponsive"></span><span data-i18n="fewerAccidents"></span></div><p class="hint" data-i18n="hoverDelayHint"></p></div>
      <div class="timing-setting" aria-labelledby="residue-label"><div class="setting-heading"><label id="residue-label" for="residue-number" data-i18n="residue"></label><div class="number-field"><input id="residue-number" type="number" inputmode="numeric"><span>ms</span></div></div><input id="residue-range" type="range" aria-labelledby="residue-label"><div class="range-labels" aria-hidden="true"><span data-i18n="hideImmediately"></span><span data-i18n="easierEntry"></span></div><p class="hint" data-i18n="residueHint"></p></div>
      <div class="toggle-setting" aria-labelledby="occluded-switch-label"><div><label id="occluded-switch-label" for="occluded-switch" data-i18n="occluded"></label><p data-i18n="occludedHint"></p></div><label class="switch"><input id="occluded-switch" type="checkbox" aria-labelledby="occluded-switch-label"><span aria-hidden="true"></span></label></div>
      <div class="toggle-setting" aria-labelledby="original-label"><div><label id="original-label" for="original-upgrade" data-i18n="original"></label><p data-i18n="originalHint"></p></div><label class="switch"><input id="original-upgrade" type="checkbox" aria-labelledby="original-label"><span aria-hidden="true"></span></label></div>
      <div class="toggle-setting" aria-labelledby="auto-arrange-label"><div><label id="auto-arrange-label" for="auto-arrange" data-i18n="autoArrange"></label><p data-i18n="autoArrangeHint"></p></div><label class="switch"><input id="auto-arrange" type="checkbox" aria-labelledby="auto-arrange-label"><span aria-hidden="true"></span></label></div>
      </section>
      <section id="settings-shortcuts" class="settings-group shortcut-settings" data-setup-section="1" aria-labelledby="shortcut-heading"><h2 id="shortcut-heading" data-i18n="shortcuts"></h2><div class="shortcut-row"><label for="sticky-shortcut" data-i18n="stickyShortcut"></label><button id="sticky-shortcut" class="shortcut-key" type="button"></button></div><div class="shortcut-row"><label for="copy-shortcut" data-i18n="copyShortcut"></label><button id="copy-shortcut" class="shortcut-key" type="button"></button></div><div class="shortcut-row nazurin-dependent" data-nazurin-dependent><label for="nazurin-shortcut" data-i18n="nazurinShortcut"></label><button id="nazurin-shortcut" class="shortcut-key" type="button" disabled></button><button class="nazurin-config-tip" type="button" data-i18n="configureNazurinFirst"></button></div><p class="hint shortcut-hint" data-i18n="shortcutHint"></p></section>
      <section id="settings-nazurin" class="settings-group" data-setup-section="2" aria-labelledby="nazurin-group-heading">
        <h2 id="nazurin-group-heading">Nazurin</h2><p class="group-description" data-i18n="nazurinOptionalHint"></p>
        <details class="nazurin-settings settings-subgroup">
        <summary class="settings-subgroup-heading"><h3 data-i18n="nazurinConnection"></h3><span id="nazurin-verification-indicator" class="verification-dot" aria-hidden="true"></span></summary>
        <div class="nazurin-body"><label class="text-field"><span>API Host</span><input id="nazurin-host" type="url" inputmode="url" autocomplete="url" placeholder="https://nazurin.example/" spellcheck="false"></label><label class="text-field"><span>Bot Token</span><input id="nazurin-token" type="password" autocomplete="off" placeholder="Telegram Bot Token" spellcheck="false"></label><p id="nazurin-http-warning" class="security-warning" data-i18n="insecureHttp" hidden></p><p class="hint nazurin-hint" data-i18n="nazurinHint"></p><div class="nazurin-actions"><button id="nazurin-save" class="primary-button" type="button" data-i18n="save"></button><button id="nazurin-test" type="button" data-i18n="testConnection"></button><button id="nazurin-clear" class="danger-button" type="button" data-i18n="clear"></button></div><span id="nazurin-status" class="nazurin-status" role="status" aria-live="polite"></span></div>
      </details>
        <details id="settings-sites" class="site-access-settings settings-subgroup" aria-labelledby="site-access-heading">
          <summary class="settings-subgroup-heading"><h3 id="site-access-heading" data-i18n="siteAccessTitle"></h3></summary>
          <div class="site-access-body">
            <button id="enable-all-sites" type="button" data-i18n="siteEnableAll"></button>
            <p class="hint site-support-hint"><span data-i18n="siteAccessHint"></span><a href="https://github.com/Yuuikic/pixiv-preview/blob/main/README.md#站点功能支持" target="_blank" rel="noopener noreferrer" data-i18n="siteSupportLink"></a><span data-i18n="siteAccessDefaultHint"></span></p>
            <div class="pixiv-access-row"><p id="pixiv-access-status" class="hint"></p><button id="enable-pixiv" type="button" data-i18n="siteAddEnable" hidden></button></div>
            <div id="site-access-grid" class="site-access-grid"></div>
            <p class="hint" data-i18n="siteGrantHint"></p>
            <div id="current-site-access" hidden><p id="current-site-name"></p><button id="enable-current-site" type="button" data-i18n="siteEnable" disabled></button></div>
            <details><summary data-i18n="enabledSitesTitle"></summary><div id="enabled-sites"></div></details>
            <p id="site-access-status" class="hint" role="status" aria-live="polite"></p>
          </div>
        </details>
        <div class="toggle-setting nazurin-dependent" data-nazurin-dependent><div><label id="nazurin-auto-hide-label" for="nazurin-auto-hide" data-i18n="nazurinAutoHide"></label><p data-i18n="nazurinAutoHideHint"></p></div><label class="switch"><input id="nazurin-auto-hide" type="checkbox" aria-labelledby="nazurin-auto-hide-label" disabled><span aria-hidden="true"></span></label><button class="nazurin-config-tip" type="button" data-i18n="configureNazurinFirst"></button></div>
      </section>
      <footer id="settings-footer"><button id="start-setup" type="button" data-i18n="setupRestart"></button><button id="reset-button" type="button" data-i18n="resetDefaults"></button><span id="save-status" role="status" aria-live="polite"></span></footer>
    </main>
    <script src="../src/nazurin-sites.js"></script><script src="../src/settings.js"></script><script src="../src/i18n.js"></script><script src="popup.js"></script>
    <script src="site-access.js"></script>
  </body>
</html>
